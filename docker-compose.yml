services:
    apache:
        build:
            context: ./docker/apache
            dockerfile: Dockerfile
        container_name: educar-apache
        ports:
            - "80:80"
        volumes:
            - ./dev:/var/www/html
            - ./storage:/nvme/arquivos_publicados/
        depends_on:
            - php
        restart: unless-stopped

    php:
        build:
            context: ./docker/php
            dockerfile: Dockerfile
        container_name: educar-php
        user: "${UID}:${GID}"
        environment:
            HOME: /tmp
        volumes:
            - ./dev:/var/www/html
            - ./storage:/nvme/arquivos_publicados/
        restart: unless-stopped

    postgres:
        build:
            context: ./docker/postgres
            dockerfile: Dockerfile
        container_name: educar-postgres
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        restart: unless-stopped

volumes:
    pgdata:
